# MawinguOps — Render Blueprint (single service).
# One Docker image builds the React dashboard and serves it from the Node API
# (same origin), alongside the /api and /ussd endpoints. Provisions:
#   1. a managed PostgreSQL database, and
#   2. the web service (dashboard UI + API + USSD webhook).
#
# Deploy: push this repo to GitHub, then Render → "New" → "Blueprint" → the repo.
# After the first deploy, seed the demo scenarios once:
#   Render dashboard → mawinguops → Shell → `npm run seed:demo`
#
# Secrets NOT in this file (set them in the Render dashboard, per service):
#   GROQ_API_KEY, AT_API_KEY, AT_USERNAME, ADMIN_TOKEN
# DATABASE_URL is wired automatically from the database below.

databases:
  - name: mawinguops-db
    databaseName: mawinguops
    plan: free

services:
  - type: web
    name: mawinguops
    runtime: docker
    # Root Dockerfile builds the dashboard and serves it from the API.
    # Paths are relative to the repo root (Render's default).
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mawinguops-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: BROADCAST_DRY_RUN
        value: "true" # SMS/email stay in demo (dry-run) unless real keys are set
      - key: GROQ_API_KEY
        sync: false # used only by the weekly pipeline, not the web service
      - key: AT_API_KEY
        sync: false
      - key: AT_USERNAME
        sync: false
      - key: ADMIN_TOKEN
        sync: false
